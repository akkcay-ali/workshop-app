name: macOS derlemesi (elle)

# Mac masaüstü sürümü. macOS makineleri GitHub kotasından daha çok dakika
# harcadığı için sadece elle başlatılır: Actions → macOS derlemesi → Run workflow.
on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: python3 tools/build-frontend.py
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
